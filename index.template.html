<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{profile.name}} links: Instagram, TikTok, YouTube, media kit, and golf discount codes." />
    <title>{{profile.name}}</title>
    <link rel="canonical" href="https://natashagolfing.com/" />
    <link rel="stylesheet" href="styles.css?v=20260705-links19" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="links-shell" aria-label="{{profile.name}} links">
      <section class="links-card">
        <div class="avatar-wrap">
          <img src="{{profile.avatar}}" alt="{{profile.name}}" />
        </div>

        <h1>{{profile.name}}</h1>
        <p class="intro">{{profile.linksIntro}}</p>

        <nav class="social-icons" aria-label="Socials">
          <a href="{{profile.instagramUrl}}" target="_blank" rel="noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M4 8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" /><circle cx="12" cy="12" r="3" /><path d="M16.5 7.5v.01" /></svg>
          </a>
          <a href="{{profile.tiktokUrl}}" target="_blank" rel="noreferrer" aria-label="TikTok">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 7.917v4.034a9.948 9.948 0 0 1-5-1.951v4.5a6.5 6.5 0 1 1-8-6.326v4.326a2.5 2.5 0 1 0 4 2V3h4.083A6.005 6.005 0 0 0 21 7.917z" /></svg>
          </a>
          <a href="{{profile.youtubeUrl}}" target="_blank" rel="noreferrer" aria-label="YouTube">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M2 8a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" /><path d="M10 9l5 3l-5 3z" /></svg>
          </a>
          <a href="mailto:{{profile.email}}" aria-label="Email {{profile.email}}">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M3 7l9 6l9-6" /></svg>
          </a>
        </nav>

        <div class="link-stack">
          <a class="link-button" href="{{profile.mediaKitUrl}}">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2zm0-12a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2zM9 18a6 6 0 0 1 6-6a6 6 0 0 1-6-6a6 6 0 0 1-6 6a6 6 0 0 1 6 6z" /></svg>
            </span>
            <span>
              <strong>Media kit</strong>
              <small>Stats, audience, and featured work</small>
            </span>
          </a>
        </div>

        <h2>Codes and affiliate links</h2>

        <div class="link-stack">
{{affiliateLinks}}
        </div>
      </section>
    </main>
    <p class="copy-toast" role="status" aria-live="polite"></p>
    <script>
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-code]");
        if (!target || !navigator.clipboard) return;
        navigator.clipboard.writeText(target.dataset.code).then(() => {
          if (target.tagName !== "BUTTON") return;
          const toast = document.querySelector(".copy-toast");
          toast.textContent = `Code ${target.dataset.code} copied`;
          document.querySelectorAll(".copied").forEach((button) => button.classList.remove("copied"));
          target.classList.add("copied");
          toast.classList.add("show");
          clearTimeout(window.copyTimer);
          window.copyTimer = setTimeout(() => {
            target.classList.remove("copied");
            toast.classList.remove("show");
          }, 1800);
        }, () => {});
      });
    </script>
  </body>
</html>
