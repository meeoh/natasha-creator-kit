<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{profile.name}} links for Instagram, TikTok, media kit, and collabs." />
    <title>{{profile.name}} Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260704-links12" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="links-shell" aria-label="{{profile.name}} links">
      <section class="links-card">
        <div class="avatar-wrap">
          <img src="../{{profile.avatar}}" alt="{{profile.name}}" />
        </div>

        <h1>{{profile.name}}</h1>
        <p class="intro">{{profile.linksIntro}}</p>

        <div class="link-stack">
          <a class="link-button instagram" href="{{profile.instagramUrl}}" target="_blank" rel="noreferrer">
            <span class="link-icon">◎</span>
            <span>
              <strong>Instagram</strong>
              <small>@{{stats.instagram.username}}</small>
            </span>
          </a>

          <a class="link-button tiktok" href="{{profile.tiktokUrl}}" target="_blank" rel="noreferrer">
            <span class="link-icon">♪</span>
            <span>
              <strong>TikTok</strong>
              <small>@{{stats.tiktok.username}}</small>
            </span>
          </a>

          <a class="link-button media-kit" href="{{profile.siteUrl}}">
            <span class="link-icon">✦</span>
            <span>
              <strong>Media kit</strong>
              <small>Stats, audience, and featured work</small>
            </span>
          </a>

          <a class="link-button email" href="mailto:{{profile.email}}">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="4" y="6.5" width="16" height="11" rx="1.8" />
                <path d="M5 8l7 5 7-5" />
              </svg>
            </span>
            <span>
              <strong>Collabs</strong>
              <small>{{profile.email}}</small>
            </span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
