<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{profile.name}} links for Instagram, TikTok, media kit, collabs, Rapsodo, and Hazard Hunters." />
    <title>{{profile.name}} Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260704-links17" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="links-shell" aria-label="{{profile.name}} links">
      <section class="links-card">
        <div class="avatar-wrap">
          <img src="../{{profile.avatar}}" alt="{{profile.name}}" />
        </div>

        <h1>{{profile.name}}</h1>
        <p class="intro">{{profile.linksIntro}}</p>

        <div class="link-stack">
          <a class="link-button instagram" href="{{profile.instagramUrl}}" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M4 8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" /><circle cx="12" cy="12" r="3" /><path d="M16.5 7.5v.01" /></svg>
            </span>
            <span>
              <strong>Instagram</strong>
              <small>@{{stats.instagram.username}}</small>
            </span>
          </a>

          <a class="link-button tiktok" href="{{profile.tiktokUrl}}" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M21 7.917v4.034a9.948 9.948 0 0 1-5-1.951v4.5a6.5 6.5 0 1 1-8-6.326v4.326a2.5 2.5 0 1 0 4 2V3h4.083A6.005 6.005 0 0 0 21 7.917z" /></svg>
            </span>
            <span>
              <strong>TikTok</strong>
              <small>@{{stats.tiktok.username}}</small>
            </span>
          </a>

          <a class="link-button media-kit" href="{{profile.siteUrl}}">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2zm0-12a2 2 0 0 1 2 2a2 2 0 0 1 2-2a2 2 0 0 1-2-2a2 2 0 0 1-2 2zM9 18a6 6 0 0 1 6-6a6 6 0 0 1-6-6a6 6 0 0 1-6 6a6 6 0 0 1 6 6z" /></svg>
            </span>
            <span>
              <strong>Media kit</strong>
              <small>Stats, audience, and featured work</small>
            </span>
          </a>

          <a class="link-button email" href="mailto:{{profile.email}}">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M3 7l9 6l9-6" /></svg>
            </span>
            <span>
              <strong>Collabs</strong>
              <small>{{profile.email}}</small>
            </span>
          </a>

          <a class="link-button rapsodo" href="http://glnk.io/91vnw/natashagan" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 18V3l7 4l-7 4" /><path d="M9 17.67c-.62.36-1 .82-1 1.33c0 1.1 1.8 2 4 2s4-.9 4-2c0-.5-.38-.97-1-1.33" /></svg>
            </span>
            <span>
              <strong>Rapsodo</strong>
              <small>Shop Rapsodo · affiliate link</small>
            </span>
          </a>

          <a class="link-button hazard-hunters" href="https://hazardhunters.net/natashagan" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M15 4l6 2v5h-3v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-8H3V6l6-2a3 3 0 0 0 6 0" /></svg>
            </span>
            <span>
              <strong>Hazard Hunters</strong>
              <small>Golf streetwear · affiliate link</small>
            </span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
